spring:
  application:
    name: mindoff-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mindoff}
    username: ${DB_USERNAME:mindoff}
    password: ${DB_PASSWORD:mindoff}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

mindoff:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:19006}
  security:
    mode: ${AUTH_MODE:dev}
    issuer-uri: ${COGNITO_ISSUER_URI:}
  receipt:
    ocr-mode: ${RECEIPT_OCR_MODE:sample}
    s3-bucket: ${RECEIPT_S3_BUCKET:}
    tesseract-language: ${TESSERACT_LANGUAGE:kor+eng}
    tesseract-timeout-seconds: ${TESSERACT_TIMEOUT_SECONDS:45}
  aws:
    region: ${AWS_REGION:ap-northeast-2}
